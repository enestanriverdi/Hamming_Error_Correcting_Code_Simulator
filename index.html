<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamming Error-Correcting Code Simülatörü</title>
    <style>
        /* --- DİJİTAL FONT İÇE AKTARMA (GÜNCELLENDİ) --- */
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        /* --- GENEL GÖRÜNÜM (SİBER TEMA) --- */
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #0b0c10;
            background-image: 
                linear-gradient(rgba(102, 252, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 252, 241, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #c5c6c7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(18, 19, 24, 0.9);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid rgba(102, 252, 241, 0.3);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.1);
        }

        h1 {
            text-align: center;
            color: #66fcf1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* --- FORM ELEMANLARI --- */
        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            margin-bottom: 8px;
            color: #45a29e;
            letter-spacing: 1px;
            font-weight: bold;
        }

        select, input {
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #45a29e;
            background-color: #0b0c10;
            color: #66fcf1;
            font-size: 16px;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            transition: box-shadow 0.3s;
        }

        select:focus, input:focus {
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: transparent;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            border-radius: 4px;
            font-size: 18px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
        }

        /* --- GÖRSELLEŞTİRME VE LOG ALANI --- */
        canvas {
            background-color: #050508;
            border: 1px solid #45a29e;
            border-radius: 4px;
            margin-top: 30px;
            width: 100%;
            height: 250px;
            cursor: crosshair;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #logArea {
            margin-top: 20px;
            padding: 20px;
            background-color: #050508;
            border: 1px solid rgba(102, 252, 241, 0.2);
            border-left: 4px solid #66fcf1;
            border-radius: 4px;
            min-height: 100px;
            line-height: 1.6;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hammıng Code Simülatörü</h1>

        <div class="input-group">
            <label for="bitLength">Veri Uzunluğu Seçin:</label>
            <select id="bitLength">
                <option value="8">8 Bit</option>
                <option value="16">16 Bit</option>
                <option value="32">32 Bit</option>
            </select>
        </div>

        <div class="input-group">
            <label for="dataInput">Veri Girişi (Binary):</label>
            <input type="text" id="dataInput" maxlength="32">
        </div>

        <button onclick="processData()">Hesapla ve Belleğe Yaz</button>

        <canvas id="memoryCanvas"></canvas>

        <div id="logArea">
            <p style="color: #aaa;">> Sistem hazır. Veri girişi bekleniyor...</p>
        </div>
    </div>

    <script>
        // --- TEMEL DEĞİŞKENLER ---
        const canvas = document.getElementById('memoryCanvas');
        const ctx = canvas.getContext('2d');
        const logArea = document.getElementById('logArea');
        
        let currentMemory = [];
        let bitBoxes = []; 

        // --- MATEMATİKSEL FONKSİYONLAR ---
        function calculateParityCount(dataLength) {
            let p = 0;
            while (Math.pow(2, p) < dataLength + p + 1) {
                p++;
            }
            return p;
        }

        function createHammingSkeleton(data) {
            const m = data.length;
            const p = calculateParityCount(m);
            const totalLength = m + p;
            
            let hammingArr = new Array(totalLength + 1); 
            let dataIndex = 0; 
            let parityPower = 0; 

            for (let i = 1; i <= totalLength; i++) {
                if (i === Math.pow(2, parityPower)) {
                    hammingArr[i] = 'P'; 
                    parityPower++;
                } else {
                    hammingArr[i] = data[dataIndex];
                    dataIndex++;
                }
            }
            return hammingArr;
        }

        function calculateParityBits(hammingArr) {
            const totalLength = hammingArr.length - 1; 
            let p = 0;

            while (Math.pow(2, p) <= totalLength) {
                let parityPos = Math.pow(2, p);
                let xorSum = 0;

                for (let i = 1; i <= totalLength; i++) {
                    if ((i & parityPos) === parityPos) {
                        if (i !== parityPos) {
                            xorSum ^= parseInt(hammingArr[i]);
                        }
                    }
                }
                hammingArr[parityPos] = xorSum.toString();
                p++;
            }
            return hammingArr;
        }

        // --- ANA İŞLEM ---
        function processData() {
            const bitLength = parseInt(document.getElementById('bitLength').value);
            const data = document.getElementById('dataInput').value;

            const regex = /^[01]+$/;
            if (!regex.test(data) || data.length !== bitLength) {
                logArea.innerHTML = `<p style="color: #ff4d4d;">> Hata: Lütfen tam olarak ${bitLength} bit uzunluğunda geçerli bir binary veri girin.</p>`;
                return;
            }

            logArea.innerHTML = `<p>> ${bitLength}-bit veri alındı. Hamming kodu hesaplanıyor...</p>`;

            let skeleton = createHammingSkeleton(data);
            let finalHammingCode = calculateParityBits(skeleton);
            let resultString = finalHammingCode.slice(1).join('');
            
            logArea.innerHTML += `<p>> Belleğe Yazılacak Kod: <strong style="color: #66fcf1; letter-spacing: 2px;">${resultString}</strong></p>`;

            drawMemory(finalHammingCode);
        }

        // --- GÖRSELLEŞTİRME ---
        function drawMemory(hammingArr, errorIndex = -1) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            currentMemory = [...hammingArr]; 
            bitBoxes = []; 
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const totalBits = hammingArr.length - 1; 
            
            const boxWidth = Math.min(40, (canvas.width - 40) / totalBits);
            const boxHeight = 50;
            const startX = (canvas.width - (totalBits * boxWidth)) / 2;
            const startY = canvas.height / 2 - boxHeight / 2;

            for (let i = 1; i <= totalBits; i++) {
                const x = startX + (i - 1) * boxWidth;
                const y = startY;

                if (i === errorIndex) {
                    ctx.fillStyle = 'rgba(255, 77, 77, 0.2)'; 
                    ctx.strokeStyle = '#ff4d4d'; 
                    ctx.shadowColor = '#ff4d4d'; 
                } else {
                    ctx.fillStyle = 'rgba(11, 12, 16, 0.8)';
                    ctx.strokeStyle = '#66fcf1'; 
                    ctx.shadowColor = '#45a29e'; 
                }
                
                ctx.lineWidth = 2;
                ctx.shadowBlur = i === errorIndex ? 20 : 10; 
                
                ctx.fillRect(x, y, boxWidth, boxHeight);
                ctx.strokeRect(x, y, boxWidth, boxHeight);

                ctx.shadowBlur = 0;

                ctx.fillStyle = i === errorIndex ? '#ff4d4d' : '#c5c6c7';
                ctx.font = '22px "JetBrains Mono", monospace'; // Font güncellendi
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(currentMemory[i], x + boxWidth / 2, y + boxHeight / 2);

                ctx.font = '14px "JetBrains Mono", monospace'; // Font güncellendi
                ctx.fillStyle = '#45a29e';
                ctx.fillText(i, x + boxWidth / 2, y + boxHeight + 25);

                bitBoxes.push({ index: i, x: x, y: y, w: boxWidth, h: boxHeight });
            }
        }

        // --- HATA TESPİT VE DÜZELTME ---
        function checkAndCorrectError(receivedMemory) {
            const totalLength = receivedMemory.length - 1; 
            let p = 0;
            let syndrome = 0; 

            while (Math.pow(2, p) <= totalLength) {
                let parityPos = Math.pow(2, p);
                let xorSum = 0;

                for (let i = 1; i <= totalLength; i++) {
                    if ((i & parityPos) === parityPos) {
                        xorSum ^= parseInt(receivedMemory[i]);
                    }
                }
                
                if (xorSum !== 0) {
                    syndrome += parityPos; 
                }
                p++;
            }

            if (syndrome !== 0) {
                logArea.innerHTML += `<p style="color: #ff9800;">> HATA TESPİT EDİLDİ: Sendrom analizi sonucu hatalı bit indeksi: <strong>${syndrome}</strong></p>`;
                
                receivedMemory[syndrome] = receivedMemory[syndrome] === '1' ? '0' : '1';
                
                logArea.innerHTML += `<p style="color: #4CAF50;">> SİSTEM DÜZELTİLDİ: ${syndrome}. bit onarıldı ve orijinal veri kurtarıldı.</p>`;
                
                setTimeout(() => {
                    drawMemory(receivedMemory);
                    logArea.innerHTML += `<p style="color: #aaa;">> Sistem normal duruma döndü.</p>`;
                }, 2000); 
            }
        }

        // --- YAPAY HATA OLUŞTURMA ---
        canvas.addEventListener('click', function(event) {
            if (currentMemory.length === 0) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const clickX = (event.clientX - rect.left) * scaleX;
            const clickY = (event.clientY - rect.top) * scaleY;

            for (let box of bitBoxes) {
                if (clickX >= box.x && clickX <= box.x + box.w &&
                    clickY >= box.y && clickY <= box.y + box.h) {
                    
                    currentMemory[box.index] = currentMemory[box.index] === '1' ? '0' : '1';

                    logArea.innerHTML += `<br><p style="color: #ff4d4d;">> KRİTİK UYARI: ${box.index}. bitte veri bozulması tespit edildi!</p>`;

                    drawMemory(currentMemory, box.index);
                    
                    checkAndCorrectError(currentMemory);
                    
                    break; 
                }
            }
        });
    </script>
</body>
</html>
